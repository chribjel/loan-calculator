<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .result-label {
            color: #666;
            font-size: 14px;
        }

        .result-value {
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }

        .leftover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }

        .leftover-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .leftover-amount {
            font-size: 32px;
            font-weight: 700;
        }

        .negative {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Loan Calculator</h1>

        <form id="loanForm">
            <div class="form-group">
                <label for="housePrice">Totalpris</label>
                <input type="number" id="housePrice" required min="0" step="1000" value="300000">
            </div>

            <div class="form-group">
                <label for="downPayment">Egenkapital</label>
                <input type="number" id="downPayment" required min="0" step="1000" value="60000">
            </div>

            <div class="form-group">
                <label for="interestRate">Rente (% per år)</label>
                <input type="number" id="interestRate" required min="0" step="0.01" value="6.5">
            </div>

            <div class="form-group">
                <label for="loanPeriod">Låneperiode (år)</label>
                <input type="number" id="loanPeriod" required min="1" max="50" value="25">
            </div>

            <div class="form-group">
                <label for="monthlyCosts">Felleskostnader</label>
                <input type="number" id="monthlyCosts" required min="0" step="10" value="500">
            </div>

            <div class="form-group">
                <label for="householdExpenses">Husstandsutgifter per måned</label>
                <input type="number" id="householdExpenses" required min="0" step="100" value="15000">
            </div>

            <div class="form-group">
                <label for="monthlyIncome">Total månedlig inntekt</label>
                <input type="number" id="monthlyIncome" required min="0" step="100" value="50000">
            </div>

            <button type="submit">Beregne</button>
        </form>

        <div id="result" class="result">
            <div class="result-item">
                <span class="result-label">Lånebeløp:</span>
                <span class="result-value" id="loanAmount">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">Månedlig betaling:</span>
                <span class="result-value" id="monthlyPayment">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">Totale månedlige kostnader:</span>
                <span class="result-value" id="totalMonthlyCosts">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">Månedlig inntekt:</span>
                <span class="result-value" id="displayIncome">0</span>
            </div>

            <div id="leftoverSection" class="leftover">
                <div class="leftover-label">Månedlig overskudd</div>
                <div class="leftover-amount" id="leftoverAmount">0</div>
            </div>
        </div>
    </div>

    <script>
        // Load saved values from localStorage on page load
        function loadSavedValues() {
            const savedData = localStorage.getItem('loanCalculatorData');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('housePrice').value = data.housePrice || 300000;
                document.getElementById('downPayment').value = data.downPayment || 60000;
                document.getElementById('interestRate').value = data.interestRate || 6.5;
                document.getElementById('loanPeriod').value = data.loanPeriod || 25;
                document.getElementById('monthlyCosts').value = data.monthlyCosts || 500;
                document.getElementById('householdExpenses').value = data.householdExpenses || 15000;
                document.getElementById('monthlyIncome').value = data.monthlyIncome || 50000;
            }
        }

        // Save values to localStorage
        function saveValues() {
            const data = {
                housePrice: document.getElementById('housePrice').value,
                downPayment: document.getElementById('downPayment').value,
                interestRate: document.getElementById('interestRate').value,
                loanPeriod: document.getElementById('loanPeriod').value,
                monthlyCosts: document.getElementById('monthlyCosts').value,
                householdExpenses: document.getElementById('householdExpenses').value,
                monthlyIncome: document.getElementById('monthlyIncome').value
            };
            localStorage.setItem('loanCalculatorData', JSON.stringify(data));
        }

        // Load saved values when page loads
        loadSavedValues();

        // Save values whenever an input changes
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', saveValues);
        });

        document.getElementById('loanForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const housePrice = parseFloat(document.getElementById('housePrice').value);
            const downPayment = parseFloat(document.getElementById('downPayment').value);
            const interestRate = parseFloat(document.getElementById('interestRate').value) / 100;
            const loanPeriod = parseFloat(document.getElementById('loanPeriod').value);
            const monthlyCosts = parseFloat(document.getElementById('monthlyCosts').value);
            const householdExpenses = parseFloat(document.getElementById('householdExpenses').value);
            const monthlyIncome = parseFloat(document.getElementById('monthlyIncome').value);

            // Save the current values
            saveValues();

            const loanAmount = housePrice - downPayment;
            const monthlyRate = interestRate / 12;
            const numberOfPayments = loanPeriod * 12;

            let monthlyPayment;
            if (monthlyRate === 0) {
                monthlyPayment = loanAmount / numberOfPayments;
            } else {
                monthlyPayment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, numberOfPayments)) /
                                (Math.pow(1 + monthlyRate, numberOfPayments) - 1);
            }

            const totalMonthlyCosts = monthlyPayment + monthlyCosts + householdExpenses;
            const leftover = monthlyIncome - totalMonthlyCosts;

            document.getElementById('loanAmount').textContent = loanAmount.toLocaleString('en-US', {maximumFractionDigits: 0});
            document.getElementById('monthlyPayment').textContent = monthlyPayment.toLocaleString('en-US', {maximumFractionDigits: 2});
            document.getElementById('totalMonthlyCosts').textContent = totalMonthlyCosts.toLocaleString('en-US', {maximumFractionDigits: 2});
            document.getElementById('displayIncome').textContent = monthlyIncome.toLocaleString('en-US', {maximumFractionDigits: 2});
            document.getElementById('leftoverAmount').textContent = leftover.toLocaleString('en-US', {maximumFractionDigits: 2});

            const leftoverSection = document.getElementById('leftoverSection');
            if (leftover < 0) {
                leftoverSection.classList.add('negative');
            } else {
                leftoverSection.classList.remove('negative');
            }

            document.getElementById('result').classList.add('show');
        });
    </script>
</body>
</html>
